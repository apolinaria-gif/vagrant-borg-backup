---
- name: Install borgbackup on client
  apt:
    name: borgbackup
    state: present
    update_cache: yes

- name: Generate SSH key for root on client
  user:
    name: root
    generate_ssh_key: yes
    ssh_key_bits: 2048
    ssh_key_file: /root/.ssh/id_rsa

- name: Fetch client public SSH key
  slurp:
    src: /root/.ssh/id_rsa.pub
  register: client_pub_key

- name: Authorize client SSH key on backup server
  delegate_to: 192.168.56.10
  authorized_key:
    user: borg
    key: "{{ client_pub_key['content'] | b64decode }}"

- name: Create backup script directory
  file:
    path: /usr/local/bin
    state: directory

- name: Deploy borg backup script
  template:
    src: borg-backup.sh.j2
    dest: /usr/local/bin/borg-backup.sh
    mode: '0755'

- name: Deploy systemd service for backup
  copy:
    dest: /etc/systemd/system/borg-backup.service
    content: |
      [Unit]
      Description=Borg Backup Service for /etc
      After=network.target

      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/borg-backup.sh

- name: Deploy systemd timer for backup (every 5 min)
  copy:
    dest: /etc/systemd/system/borg-backup.timer
    content: |
      [Unit]
      Description=Run Borg Backup every 5 minutes

      [Timer]
      OnCalendar=*:0/5
      Persistent=true

      [Install]
      WantedBy=timers.target

- name: Enable and start borg-backup timer
  systemd:
    name: borg-backup.timer
    enabled: yes
    state: started
    daemon_reload: yes